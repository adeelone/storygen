name: Eval Gate
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 4 * * *"
jobs:
  eval:
    name: Eval gate
    runs-on: ubuntu-latest
    env:
      TEXT_PROVIDER: ${{ github.event_name == 'schedule' && secrets.GOOGLE_CLOUD_PROJECT != '' && 'gemini' || 'mock' }}
      IMAGE_PROVIDER: mock
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e "./backend[dev]"
      - run: make eval
      - uses: actions/upload-artifact@v4
        with: { name: eval-report, path: backend/reports }
