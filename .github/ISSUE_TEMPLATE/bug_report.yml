name: Bug report
description: Report reproducible StoryGen behavior that is not expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: behavior
    attributes: { label: What happened?, description: Include expected and actual behavior. }
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes: { label: Steps to reproduce, placeholder: "1. Open...\n2. Enter..." }
    validations: { required: true }
  - type: input
    id: environment
    attributes: { label: Environment, placeholder: "Browser, OS, Docker or bare metal" }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes: { label: Relevant logs, description: Remove secrets and personal story content before sharing. }
