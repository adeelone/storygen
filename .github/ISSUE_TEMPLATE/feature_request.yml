name: Feature request
description: Propose a user-facing improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes: { label: User need, description: What problem does this solve? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed experience }
    validations: { required: true }
  - type: textarea
    id: safety
    attributes: { label: Safety, privacy, or cost considerations }
